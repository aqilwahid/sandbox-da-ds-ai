name: Deploy ke GitHub Pages

# Cara pakai: Settings → Pages → Source: "GitHub Actions", lalu jalankan workflow ini
# dari tab Actions (tombol "Run workflow"). Agar otomatis setiap push ke branch utama,
# tambahkan di bawah `on:`
#   push:
#     branches: [Main]
#
# Catatan: GitHub Pages tidak bisa mengirim header COOP/COEP. Aplikasi tetap berjalan normal;
# bedanya, tombol Stop menghentikan Python dengan memuat ulang runtime (beberapa detik).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
