<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sandbox latihan hands-on Data Analyst (SQL), Data Science (Python), dan AI Engineering — berjalan langsung di browser dengan visual interaktif." />
    <meta name="theme-color" content="#0b0f16" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sandbox Data & AI</title>
    <script>
      // Terapkan tema & ukuran tersimpan sebelum render (hindari kedip)
      try {
        var p = JSON.parse(localStorage.getItem('sbx-prefs-v2') || '{}');
        document.documentElement.dataset.theme = p.theme || 'dark';
        document.documentElement.dataset.size = p.size || 'md';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Aplikasi ini membutuhkan JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
